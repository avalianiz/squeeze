# Build Squeeze release installers for all supported platforms.
# Requires FFmpeg sidecar artifacts (from Build FFmpeg sidecars workflow or
# an ffmpeg-sidecars-* GitHub release).
# Releases only run from v* tags (no release-N drafts).
# A tag spends one Windows runner, one Linux runner, and two macOS runners.
# There is no pull_request trigger. Do not add one.

name: Release

on:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: "ffmpeg-sidecars release tag (empty = latest ffmpeg-sidecars-*)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-tag:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail without version tag
        run: |
          echo "Release builds must run from a v* tag (for example vX.Y.Z)." >&2
          echo "Push a tag, or workflow_dispatch from that tag ref." >&2
          exit 1

  # Cheap gate so a broken frontend does not spend four paid runners.
  check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Notices up to date
        run: npm run notices -- --check

  release:
    needs: check
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            bundler_ext: zip
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            bundler_ext: tar.gz
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundler_ext: tar.gz
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundler_ext: tar.gz

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    name: squeeze (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Resolve FFmpeg sidecar release
        id: ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.ffmpeg_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release list --limit 30 --json tagName,isDraft \
              --jq '[.[] | select(.tagName|startswith("ffmpeg-sidecars")) | .tagName][0]')"
          fi
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "No ffmpeg-sidecars release found. Run Build FFmpeg sidecars first." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using FFmpeg sidecars from $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download FFmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TAG="${{ steps.ffmpeg.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.bundler_ext }}"
          ASSET="squeeze-ffmpeg-${TARGET}.${EXT}"
          gh release download "$TAG" -p "$ASSET" -D /tmp/ffmpeg-dl
          if [[ "$EXT" == "zip" ]]; then
            unzip -o "/tmp/ffmpeg-dl/$ASSET" -d src-tauri/binaries
          else
            tar -xzf "/tmp/ffmpeg-dl/$ASSET" -C src-tauri/binaries
          fi
          ls -lh src-tauri/binaries/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Windows code signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "squeeze-codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          Import-PfxCertificate `
            -FilePath $path `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) `
            | Out-Null
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.HasPrivateKey -and $_.Thumbprint } |
            Select-Object -First 1
          if (-not $cert) { throw "No code signing certificate imported" }

          $confPath = "src-tauri/tauri.conf.json"
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not $json.bundle.windows) {
            $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          $json.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $json.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $json.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $json | ConvertTo-Json -Depth 30 | Set-Content -Path $confPath -Encoding utf8
          Write-Host "Configured Authenticode signing with thumbprint $($cert.Thumbprint)"

      - name: Require update signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "Signed updates need both GitHub secrets:" >&2
            echo "  TAURI_SIGNING_PRIVATE_KEY — contents of the gitignored .keys/squeeze.key file" >&2
            echo "  TAURI_SIGNING_PRIVATE_KEY_PASSWORD — contents of .keys/password.txt" >&2
            echo "See CONTRIBUTING.md. Do not commit the private key." >&2
            exit 1
          fi

      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          {
            echo "Local video compression for Windows, macOS, and Linux. Nothing is uploaded."
            echo ""
            if [[ -f RELEASE_NOTES.md ]]; then
              cat RELEASE_NOTES.md
              echo ""
            fi
            echo "## Install"
            echo ""
            echo "- Windows x64: \`Squeeze_${VERSION}_x64-setup.exe\` (current user or Program Files) or \`Squeeze_${VERSION}_x64_en-US.msi\`"
            echo "- macOS Apple Silicon: \`Squeeze_${VERSION}_aarch64.dmg\`"
            echo "- macOS Intel: \`Squeeze_${VERSION}_x64.dmg\`"
            echo "- Linux x64: \`Squeeze_${VERSION}_amd64.AppImage\` or \`Squeeze_${VERSION}_amd64.deb\`"
            echo ""
            echo "\`Squeeze_*.app.tar.gz\` files are update payloads. Install macOS from the \`.dmg\`."
            echo ""
            echo "## Notes"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Windows may show SmartScreen “Unknown publisher” until an Authenticode certificate is configured."
            echo "- macOS may say the app is from an unidentified developer until it is notarized."
            echo "- FFmpeg sidecars stay on \`ffmpeg-sidecars-*\` releases and are not end-user downloads."
            echo "- App code is MIT. Bundled FFmpeg and x264 are GPL-2.0-or-later. See NOTICES.txt."
            echo "- Installed copies check \`latest.json\` on this release and can download a signed update."
          } > "$RUNNER_TEMP/release-body.md"
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/release-body.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Squeeze ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
