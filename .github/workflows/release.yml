# Build Squeeze release installers for all supported platforms.
# Requires FFmpeg sidecar artifacts (from Build FFmpeg sidecars workflow or
# an ffmpeg-sidecars-* GitHub release).

name: Release

on:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: "ffmpeg-sidecars release tag (empty = latest ffmpeg-sidecars-*)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            bundler_ext: zip
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            bundler_ext: tar.gz
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundler_ext: tar.gz
          - platform: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundler_ext: tar.gz

    runs-on: ${{ matrix.platform }}
    name: squeeze (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Resolve FFmpeg sidecar release
        id: ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.ffmpeg_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release list --limit 30 --json tagName,isDraft \
              --jq '[.[] | select(.tagName|startswith("ffmpeg-sidecars")) | .tagName][0]')"
          fi
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "No ffmpeg-sidecars release found. Run Build FFmpeg sidecars first." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using FFmpeg sidecars from $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download FFmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TAG="${{ steps.ffmpeg.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.bundler_ext }}"
          ASSET="squeeze-ffmpeg-${TARGET}.${EXT}"
          gh release download "$TAG" -p "$ASSET" -D /tmp/ffmpeg-dl
          if [[ "$EXT" == "zip" ]]; then
            unzip -o "/tmp/ffmpeg-dl/$ASSET" -d src-tauri/binaries
          else
            tar -xzf "/tmp/ffmpeg-dl/$ASSET" -C src-tauri/binaries
          fi
          ls -lh src-tauri/binaries/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('release-{0}', github.run_number) }}
          releaseName: Squeeze ${{ github.ref_type == 'tag' && github.ref_name || format('#{0}', github.run_number) }}
          releaseBody: |
            Cross-platform Squeeze build with Squeeze-minimal FFmpeg sidecars.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false
